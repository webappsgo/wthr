# =============================================================================
# TEST / LINT / VULNERABILITY SCAN
# =============================================================================

test:
  <<: *go-build
  stage: test
  script:
    - go test -v -cover ./...
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "beta"

lint:
  <<: *go-build
  stage: test
  script:
    - go vet ./...
    - staticcheck ./...
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "beta"

vuln-scan:
  <<: *go-build
  stage: test
  script:
    # govulncheck is pre-installed in casjaysdev/go:latest - never `go install` it here
    - govulncheck ./...
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "beta"

# =============================================================================
# STABLE RELEASE
# =============================================================================

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build:linux-amd64
    - build:linux-arm64
    - build:darwin-amd64
    - build:darwin-arm64
    - build:windows-amd64
    - build:windows-arm64
    - build:freebsd-amd64
    - build:freebsd-arm64
    - test
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
    - echo "${RELEASE_VERSION}" > version.txt
    # Source archive - the job runs in the full repo checkout (not an
    # isolated directory), so already-staged release assets are excluded to
    # avoid archiving our own output
    - >
      tar --exclude='.git' --exclude='${PROJECT_NAME}-*' --exclude='version.txt'
      --exclude='sha256.txt' --exclude='sha512.txt'
      -czf ${PROJECT_NAME}-${RELEASE_VERSION}-source.tar.gz .
    # Consolidated sha256.txt/sha512.txt over every release asset - the file
    # list is pre-captured once so both checksum files cover the identical
    # asset set and never hash each other or themselves
    - FILES="version.txt ${PROJECT_NAME}-*"
    - sha256sum $FILES > sha256.txt
    - sha512sum $FILES > sha512.txt
    # Per-asset .sha256 sidecars are required by the self-update flow (PART 23)
    - for f in $FILES; do sha256sum "$f" > "$f.sha256"; done
  artifacts:
    paths:
      - version.txt
      - sha256.txt
      - sha512.txt
      - ${PROJECT_NAME}-*
    expire_in: 1 week
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Release created by GitLab CI"
    assets:
      links:
        - name: "${PROJECT_NAME}-linux-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-linux-amd64?job=build:linux-amd64"
        - name: "${PROJECT_NAME}-linux-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-linux-arm64?job=build:linux-arm64"
        - name: "${PROJECT_NAME}-darwin-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-darwin-amd64?job=build:darwin-amd64"
        - name: "${PROJECT_NAME}-darwin-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-darwin-arm64?job=build:darwin-arm64"
        - name: "${PROJECT_NAME}-windows-amd64.exe"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-windows-amd64.exe?job=build:windows-amd64"
        - name: "${PROJECT_NAME}-windows-arm64.exe"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-windows-arm64.exe?job=build:windows-arm64"
        - name: "${PROJECT_NAME}-freebsd-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-freebsd-amd64?job=build:freebsd-amd64"
        - name: "${PROJECT_NAME}-freebsd-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-freebsd-arm64?job=build:freebsd-arm64"
        - name: "${PROJECT_NAME}-sbom.cdx.json"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-sbom.cdx.json?job=build:linux-amd64"
        - name: "${PROJECT_NAME}-${RELEASE_VERSION}-source.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${PROJECT_NAME}-${RELEASE_VERSION}-source.tar.gz?job=release"
        - name: "sha256.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/sha256.txt?job=release"
        - name: "sha512.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/sha512.txt?job=release"
        - name: "version.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/version.txt?job=release"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/

# =============================================================================
# BETA BUILDS (beta branch) - All 8 platforms
# =============================================================================

build:beta:
  <<: *go-build
  stage: build
  before_script:
    # all tooling is pre-installed in casjaysdev/go:latest - never `apk add` inside a CI job
    - export VERSION="$(date +%Y%m%d%H%M%S)-beta"
    - export COMMIT_ID="${CI_COMMIT_SHA:0:7}"
    - export BUILD_EPOCH="$(date -u +%s)"
    - export BUILD_DATE="$(date -u -d @$BUILD_EPOCH +"%Y-%m-%dT%H:%M:%SZ")"
    # OFFICIAL_SITE (optional): site.txt wins; otherwise use CI/CD Variables or leave empty
    - |
      if [ -f site.txt ]; then
        export OFFICIAL_SITE="$(cat site.txt)"
      else
        export OFFICIAL_SITE="${OFFICIAL_SITE:-}"
      fi
    - export LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.CommitID=${COMMIT_ID}' -X 'main.BuildEpoch=${BUILD_EPOCH}' -X 'main.BuildDate=${BUILD_DATE}' -X 'main.OfficialSite=${OFFICIAL_SITE}'"
  script:
    # Build all 8 platforms
    - GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-linux-amd64 ./src
    - GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-linux-arm64 ./src
    - GOOS=darwin GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-darwin-amd64 ./src
    - GOOS=darwin GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-darwin-arm64 ./src
    - GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-windows-amd64.exe ./src
    - GOOS=windows GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-windows-arm64.exe ./src
    - GOOS=freebsd GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-freebsd-amd64 ./src
    - GOOS=freebsd GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-freebsd-arm64 ./src
    # Build CLI if exists
    - if [ -d "src/client" ]; then GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-linux-amd64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-linux-arm64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=darwin GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-darwin-amd64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=darwin GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-darwin-arm64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-windows-amd64.exe ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=windows GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-windows-arm64.exe ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=freebsd GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-freebsd-amd64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=freebsd GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-freebsd-arm64 ./src/client; fi
    # Build Agent if exists
    - if [ -d "src/agent" ]; then GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-linux-amd64 ./src/agent; fi
    - if [ -d "src/agent" ]; then GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-linux-arm64 ./src/agent; fi
    - if [ -d "src/agent" ]; then GOOS=darwin GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-darwin-amd64 ./src/agent; fi
    - if [ -d "src/agent" ]; then GOOS=darwin GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-darwin-arm64 ./src/agent; fi
    - if [ -d "src/agent" ]; then GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-windows-amd64.exe ./src/agent; fi
    - if [ -d "src/agent" ]; then GOOS=windows GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-windows-arm64.exe ./src/agent; fi
    - if [ -d "src/agent" ]; then GOOS=freebsd GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-freebsd-amd64 ./src/agent; fi
    - if [ -d "src/agent" ]; then GOOS=freebsd GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-freebsd-arm64 ./src/agent; fi
    # SBOM is release-level - generate once per build (cyclonedx-gomod is
    # pre-installed in casjaysdev/go:latest)
    - cyclonedx-gomod mod -json -output ${PROJECT_NAME}-sbom.cdx.json
    # Export VERSION via dotenv so release:beta can consume the exact version
    # embedded in these binaries - the release identity must match the embedded
    # identity, never recompute the timestamp downstream
    - echo "RELEASE_VERSION=${VERSION}" > release.env
  artifacts:
    paths:
      - ${PROJECT_NAME}-*
    reports:
      dotenv: release.env
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "beta"

release:beta:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build:beta
    - test
  script:
    - echo "Creating beta release ${RELEASE_VERSION}"
    - echo "${RELEASE_VERSION}" > version.txt
    # Source archive - already-staged release assets are excluded to avoid
    # archiving our own output
    - >
      tar --exclude='.git' --exclude='${PROJECT_NAME}-*' --exclude='version.txt'
      --exclude='sha256.txt' --exclude='sha512.txt'
      -czf ${PROJECT_NAME}-${RELEASE_VERSION}-source.tar.gz .
    - FILES="version.txt ${PROJECT_NAME}-*"
    - sha256sum $FILES > sha256.txt
    - sha512sum $FILES > sha512.txt
    # Per-asset .sha256 sidecars are required by the self-update flow (PART 23)
    - for f in $FILES; do sha256sum "$f" > "$f.sha256"; done
  artifacts:
    paths:
      - version.txt
      - sha256.txt
      - sha512.txt
      - ${PROJECT_NAME}-*
    expire_in: 1 week
  release:
    tag_name: "$RELEASE_VERSION"
    name: "Beta $RELEASE_VERSION"
    description: "Beta release created by GitLab CI"
    assets:
      links:
        - name: "${PROJECT_NAME}-linux-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-linux-amd64?job=build:beta"
        - name: "${PROJECT_NAME}-linux-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-linux-arm64?job=build:beta"
        - name: "${PROJECT_NAME}-darwin-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-darwin-amd64?job=build:beta"
        - name: "${PROJECT_NAME}-darwin-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-darwin-arm64?job=build:beta"
        - name: "${PROJECT_NAME}-windows-amd64.exe"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-windows-amd64.exe?job=build:beta"
        - name: "${PROJECT_NAME}-windows-arm64.exe"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-windows-arm64.exe?job=build:beta"
        - name: "${PROJECT_NAME}-freebsd-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-freebsd-amd64?job=build:beta"
        - name: "${PROJECT_NAME}-freebsd-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-freebsd-arm64?job=build:beta"
        - name: "${PROJECT_NAME}-sbom.cdx.json"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-sbom.cdx.json?job=build:beta"
        - name: "${PROJECT_NAME}-${RELEASE_VERSION}-source.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-${RELEASE_VERSION}-source.tar.gz?job=release:beta"
        - name: "sha256.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/sha256.txt?job=release:beta"
        - name: "sha512.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/sha512.txt?job=release:beta"
        - name: "version.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/version.txt?job=release:beta"
  rules:
    - if: $CI_COMMIT_BRANCH == "beta"

# =============================================================================
# DAILY BUILDS (Scheduled + main/master push) - All 8 platforms
# =============================================================================

build:daily:
  <<: *go-build
  stage: build
  before_script:
    # all tooling is pre-installed in casjaysdev/go:latest - never `apk add` inside a CI job
    # Daily identity is the commit, not a timestamp - the daily
    # release is a single rolling release, not a versioned tag
    - export VERSION="${CI_COMMIT_SHA:0:7}"
    - export COMMIT_ID="${CI_COMMIT_SHA:0:7}"
    - export BUILD_EPOCH="$(date -u +%s)"
    - export BUILD_DATE="$(date -u -d @$BUILD_EPOCH +"%Y-%m-%dT%H:%M:%SZ")"
    # OFFICIAL_SITE (optional): site.txt wins; otherwise use CI/CD Variables or leave empty
    - |
      if [ -f site.txt ]; then
        export OFFICIAL_SITE="$(cat site.txt)"
      else
        export OFFICIAL_SITE="${OFFICIAL_SITE:-}"
      fi
    - export LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.CommitID=${COMMIT_ID}' -X 'main.BuildEpoch=${BUILD_EPOCH}' -X 'main.BuildDate=${BUILD_DATE}' -X 'main.OfficialSite=${OFFICIAL_SITE}'"
  script:
    # Build all 8 platforms
    - GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-linux-amd64 ./src
    - GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-linux-arm64 ./src
    - GOOS=darwin GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-darwin-amd64 ./src
    - GOOS=darwin GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-darwin-arm64 ./src
    - GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-windows-amd64.exe ./src
    - GOOS=windows GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-windows-arm64.exe ./src
    - GOOS=freebsd GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-freebsd-amd64 ./src
    - GOOS=freebsd GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-freebsd-arm64 ./src
    # Build CLI if exists
    - if [ -d "src/client" ]; then GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-linux-amd64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-linux-arm64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=darwin GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-darwin-amd64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=darwin GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-darwin-arm64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-windows-amd64.exe ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=windows GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-windows-arm64.exe ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=freebsd GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-freebsd-amd64 ./src/client; fi
    - if [ -d "src/client" ]; then GOOS=freebsd GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-freebsd-arm64 ./src/client; fi
    # Build Agent if exists
    - if [ -d "src/agent" ]; then GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-linux-amd64 ./src/agent; fi
    - if [ -d "src/agent" ]; then GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-linux-arm64 ./src/agent; fi
    - if [ -d "src/agent" ]; then GOOS=darwin GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-darwin-amd64 ./src/agent; fi
    - if [ -d "src/agent" ]; then GOOS=darwin GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-darwin-arm64 ./src/agent; fi
    - if [ -d "src/agent" ]; then GOOS=windows GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-windows-amd64.exe ./src/agent; fi
    - if [ -d "src/agent" ]; then GOOS=windows GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-windows-arm64.exe ./src/agent; fi
    - if [ -d "src/agent" ]; then GOOS=freebsd GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-freebsd-amd64 ./src/agent; fi
    - if [ -d "src/agent" ]; then GOOS=freebsd GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-freebsd-arm64 ./src/agent; fi
    # SBOM is release-level - generate once per build (cyclonedx-gomod is
    # pre-installed in casjaysdev/go:latest)
    - cyclonedx-gomod mod -json -output ${PROJECT_NAME}-sbom.cdx.json
  artifacts:
    paths:
      - ${PROJECT_NAME}-*
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: manual
      allow_failure: true

release:daily:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build:daily
    - test
  before_script:
    # Delete the prior rolling `daily` release + tag - the daily channel is a
    # single rolling release, not a versioned tag, so the old one must go
    # before the new one is published
    - >
      curl --request DELETE --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/daily" || true
    - >
      curl --request DELETE --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags/daily" || true
  script:
    # Daily identity is the commit, not a timestamp - CI_COMMIT_SHA is a
    # predefined variable, so it needs no cross-job dotenv passthrough
    - echo "${CI_COMMIT_SHA:0:7}" > version.txt
    # Source archive - already-staged release assets are excluded to avoid
    # archiving our own output
    - >
      tar --exclude='.git' --exclude='${PROJECT_NAME}-*' --exclude='version.txt'
      --exclude='sha256.txt' --exclude='sha512.txt'
      -czf ${PROJECT_NAME}-${CI_COMMIT_SHA:0:7}-source.tar.gz .
    - FILES="version.txt ${PROJECT_NAME}-*"
    - sha256sum $FILES > sha256.txt
    - sha512sum $FILES > sha512.txt
    # Per-asset .sha256 sidecars are required by the self-update flow (PART 23)
    - for f in $FILES; do sha256sum "$f" > "$f.sha256"; done
  artifacts:
    paths:
      - version.txt
      - sha256.txt
      - sha512.txt
      - ${PROJECT_NAME}-*
    expire_in: 1 day
  release:
    tag_name: "daily"
    name: "Daily Build ${CI_COMMIT_SHA:0:7}"
    description: "Daily build: ${CI_COMMIT_SHA:0:7}"
    assets:
      links:
        - name: "${PROJECT_NAME}-linux-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-linux-amd64?job=build:daily"
        - name: "${PROJECT_NAME}-linux-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-linux-arm64?job=build:daily"
        - name: "${PROJECT_NAME}-darwin-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-darwin-amd64?job=build:daily"
        - name: "${PROJECT_NAME}-darwin-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-darwin-arm64?job=build:daily"
        - name: "${PROJECT_NAME}-windows-amd64.exe"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-windows-amd64.exe?job=build:daily"
        - name: "${PROJECT_NAME}-windows-arm64.exe"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-windows-arm64.exe?job=build:daily"
        - name: "${PROJECT_NAME}-freebsd-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-freebsd-amd64?job=build:daily"
        - name: "${PROJECT_NAME}-freebsd-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-freebsd-arm64?job=build:daily"
        - name: "${PROJECT_NAME}-sbom.cdx.json"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-sbom.cdx.json?job=build:daily"
        - name: "${PROJECT_NAME}-${CI_COMMIT_SHA:0:7}-source.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/${PROJECT_NAME}-${CI_COMMIT_SHA:0:7}-source.tar.gz?job=release:daily"
        - name: "sha256.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/sha256.txt?job=release:daily"
        - name: "sha512.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/sha512.txt?job=release:daily"
        - name: "version.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_BRANCH}/raw/version.txt?job=release:daily"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
      when: manual
      allow_failure: true

# =============================================================================
# DOCKER BUILDS
# =============================================================================

docker:build:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker buildx create --name multiarch-builder --use 2>/dev/null || docker buildx use multiarch-builder
  script:
    - |
      # Determine version and tags based on trigger
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        YYMM=$(date +%y%m)
        TAGS="-t $CI_REGISTRY_IMAGE:$VERSION -t $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$YYMM -t $CI_REGISTRY_IMAGE:${CI_COMMIT_SHA:0:7}"
      elif [ "$CI_COMMIT_BRANCH" = "beta" ]; then
        VERSION="beta-${CI_COMMIT_SHA:0:7}"
        TAGS="-t $CI_REGISTRY_IMAGE:beta -t $CI_REGISTRY_IMAGE:${CI_COMMIT_SHA:0:7}"
      else
        VERSION="dev-${CI_COMMIT_SHA:0:7}"
        TAGS="-t $CI_REGISTRY_IMAGE:${CI_COMMIT_SHA:0:7}"
      fi
      BUILD_EPOCH="$(date -u +%s)"
      BUILD_DATE="$(date -u -d @$BUILD_EPOCH +"%Y-%m-%dT%H:%M:%SZ")"
    - |
      # Build multi-arch with OCI labels and manifest annotations
      docker buildx build \
        -f docker/Dockerfile \
        --platform linux/amd64,linux/arm64 \
        --build-arg VERSION="${VERSION}" \
        --build-arg COMMIT_ID="${CI_COMMIT_SHA:0:7}" \
        --build-arg BUILD_DATE="${BUILD_DATE}" \
        --build-arg BUILD_EPOCH="${BUILD_EPOCH}" \
        --build-arg OFFICIAL_SITE="${OFFICIAL_SITE}" \
        --label "org.opencontainers.image.vendor=${PROJECT_ORG}" \
        --label "org.opencontainers.image.authors=${PROJECT_ORG}" \
        --label "org.opencontainers.image.title=${PROJECT_NAME}" \
        --label "org.opencontainers.image.base.name=${PROJECT_NAME}" \
        --label "org.opencontainers.image.description=${PROJECT_NAME} - standard image (alpine)" \
        --label "org.opencontainers.image.licenses=MIT" \
        --label "org.opencontainers.image.version=${VERSION}" \
        --label "org.opencontainers.image.created=${BUILD_DATE}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA:0:7}" \
        --label "org.opencontainers.image.url=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.documentation=${CI_PROJECT_URL}" \
        --annotation "manifest:org.opencontainers.image.vendor=${PROJECT_ORG}" \
        --annotation "manifest:org.opencontainers.image.authors=${PROJECT_ORG}" \
        --annotation "manifest:org.opencontainers.image.title=${PROJECT_NAME}" \
        --annotation "manifest:org.opencontainers.image.base.name=${PROJECT_NAME}" \
        --annotation "manifest:org.opencontainers.image.description=${PROJECT_NAME} - standard image (alpine)" \
        --annotation "manifest:org.opencontainers.image.licenses=MIT" \
        --annotation "manifest:org.opencontainers.image.version=${VERSION}" \
        --annotation "manifest:org.opencontainers.image.created=${BUILD_DATE}" \
        --annotation "manifest:org.opencontainers.image.revision=${CI_COMMIT_SHA:0:7}" \
        --annotation "manifest:org.opencontainers.image.url=${CI_PROJECT_URL}" \
        --annotation "manifest:org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --annotation "manifest:org.opencontainers.image.documentation=${CI_PROJECT_URL}" \
        $TAGS \
        --push \
        .
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "beta"
    # Any other branch also builds/pushes {commit_id} (no :devel tag - see docker:build-devel)
    - if: $CI_COMMIT_BRANCH

docker:build-aio:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker buildx create --name multiarch-builder --use 2>/dev/null || docker buildx use multiarch-builder
  script:
    - |
      # AIO uses same repo with -aio tag suffix: {repo}:{tag}-aio
      IMAGE="${CI_REGISTRY_IMAGE}"
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        YYMM=$(date +%y%m)
        TAGS="-t ${IMAGE}:${VERSION}-aio -t ${IMAGE}:latest-aio -t ${IMAGE}:${YYMM}-aio -t ${IMAGE}:${CI_COMMIT_SHA:0:7}-aio"
      elif [ "$CI_COMMIT_BRANCH" = "beta" ]; then
        VERSION="beta-${CI_COMMIT_SHA:0:7}"
        TAGS="-t ${IMAGE}:beta-aio -t ${IMAGE}:${CI_COMMIT_SHA:0:7}-aio"
      else
        VERSION="dev-${CI_COMMIT_SHA:0:7}"
        TAGS="-t ${IMAGE}:${CI_COMMIT_SHA:0:7}-aio"
      fi
      BUILD_EPOCH="$(date -u +%s)"
      BUILD_DATE="$(date -u -d @$BUILD_EPOCH +"%Y-%m-%dT%H:%M:%SZ")"
    - |
      # Build multi-arch all-in-one with OCI labels and manifest annotations
      docker buildx build \
        -f docker/Dockerfile.aio \
        --platform linux/amd64,linux/arm64 \
        --build-arg VERSION="${VERSION}" \
        --build-arg COMMIT_ID="${CI_COMMIT_SHA:0:7}" \
        --build-arg BUILD_DATE="${BUILD_DATE}" \
        --build-arg BUILD_EPOCH="${BUILD_EPOCH}" \
        --build-arg OFFICIAL_SITE="${OFFICIAL_SITE}" \
        --label "org.opencontainers.image.vendor=${PROJECT_ORG}" \
        --label "org.opencontainers.image.authors=${PROJECT_ORG}" \
        --label "org.opencontainers.image.title=${PROJECT_NAME}-aio" \
        --label "org.opencontainers.image.description=${PROJECT_NAME} - all-in-one (debian + postgresql + valkey + tor)" \
        --label "org.opencontainers.image.licenses=MIT" \
        --label "org.opencontainers.image.version=${VERSION}" \
        --label "org.opencontainers.image.created=${BUILD_DATE}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA:0:7}" \
        --label "org.opencontainers.image.url=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.documentation=${CI_PROJECT_URL}" \
        --annotation "manifest:org.opencontainers.image.vendor=${PROJECT_ORG}" \
        --annotation "manifest:org.opencontainers.image.authors=${PROJECT_ORG}" \
        --annotation "manifest:org.opencontainers.image.title=${PROJECT_NAME}-aio" \
        --annotation "manifest:org.opencontainers.image.description=${PROJECT_NAME} - all-in-one (debian + postgresql + valkey + tor)" \
        --annotation "manifest:org.opencontainers.image.licenses=MIT" \
        --annotation "manifest:org.opencontainers.image.version=${VERSION}" \
        --annotation "manifest:org.opencontainers.image.created=${BUILD_DATE}" \
        --annotation "manifest:org.opencontainers.image.revision=${CI_COMMIT_SHA:0:7}" \
        --annotation "manifest:org.opencontainers.image.url=${CI_PROJECT_URL}" \
        --annotation "manifest:org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --annotation "manifest:org.opencontainers.image.documentation=${CI_PROJECT_URL}" \
        $TAGS \
        --push \
        .
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "beta"
    # Any other branch also builds/pushes {commit_id}-aio (no :devel-aio tag - Dockerfile.dev.aio does not exist)
    - if: $CI_COMMIT_BRANCH

