stages:
  - lint
  - test
  - build
  - security
  - release

variables:
  PROJECTNAME: wthr
  CGO_ENABLED: "0"
  GOFLAGS: "-buildvcs=false"

default:
  image: casjaysdev/go:latest

# ─── LINT ────────────────────────────────────────────────────────────────────

lint:
  stage: lint
  before_script:
    - go version
  script:
    - go vet ./...

# ─── TEST ────────────────────────────────────────────────────────────────────

test:
  stage: test
  before_script:
    - go version
  script:
    - go test -v -race -coverprofile=coverage.out ./...
  artifacts:
    paths:
      - coverage.out
    expire_in: 7 days

# ─── BUILD ───────────────────────────────────────────────────────────────────

.build_template: &build_template
  stage: build
  needs: [test]
  before_script:
    - |
      VERSION=$(cat release.txt 2>/dev/null || echo "0.1.0")
      COMMIT_ID=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
      BUILD_DATE=$(date +"%a %b %d, %Y at %H:%M:%S %Z")
      OFFICIALSITE=$(cat site.txt 2>/dev/null || echo "")
      export LDFLAGS="-s -w -X 'main.Version=$VERSION' -X 'main.CommitID=$COMMIT_ID' -X 'main.BuildDate=$BUILD_DATE' -X 'main.OfficialSite=$OFFICIALSITE'"
  script:
    - mkdir -p binaries
    - GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="$LDFLAGS" -o binaries/${PROJECTNAME}-${GOOS}-${GOARCH}${EXT} ./src
    - GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="$LDFLAGS" -o binaries/${PROJECTNAME}-cli-${GOOS}-${GOARCH}${EXT} ./src/client
  artifacts:
    paths:
      - binaries/
    expire_in: 7 days

build:linux-amd64:
  <<: *build_template
  variables:
    GOOS: linux
    GOARCH: amd64

build:linux-arm64:
  <<: *build_template
  variables:
    GOOS: linux
    GOARCH: arm64

build:darwin-amd64:
  <<: *build_template
  variables:
    GOOS: darwin
    GOARCH: amd64

build:darwin-arm64:
  <<: *build_template
  variables:
    GOOS: darwin
    GOARCH: arm64

build:windows-amd64:
  <<: *build_template
  variables:
    GOOS: windows
    GOARCH: amd64
    EXT: .exe

build:windows-arm64:
  <<: *build_template
  variables:
    GOOS: windows
    GOARCH: arm64
    EXT: .exe

build:freebsd-amd64:
  <<: *build_template
  variables:
    GOOS: freebsd
    GOARCH: amd64

build:freebsd-arm64:
  <<: *build_template
  variables:
    GOOS: freebsd
    GOARCH: arm64

# ─── SECURITY ────────────────────────────────────────────────────────────────

vuln-scan:
  stage: security
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./...

# ─── RELEASE ─────────────────────────────────────────────────────────────────

release:
  stage: release
  needs:
    - build:linux-amd64
    - build:linux-arm64
    - build:darwin-amd64
    - build:darwin-arm64
    - build:windows-amd64
    - build:windows-arm64
    - build:freebsd-amd64
    - build:freebsd-arm64
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Release $CI_COMMIT_TAG"
    - ls -la binaries/
