variables:
  PROJECT_NAME: "wthr"
  PROJECT_ORG: "webappsgo"
  CGO_ENABLED: "0"
  GOOS: linux
  GOARCH: amd64
  # Go CI defaults to casjaysdev/go:latest - a docker/Dockerfile.build only for a genuine custom need, and then FROM casjaysdev/go:latest.
  BUILD_IMAGE: "casjaysdev/go:latest"

stages:
  - build
  - test
  - package
  - release
  - docker

.go-build-template: &go-build
  image: $BUILD_IMAGE
  before_script:
    # NOTE: all tooling (git, bash, govulncheck, cyclonedx-gomod, etc.) is pre-installed
    # in casjaysdev/go:latest - never `apk add` or `go install` inside a CI job.
    - export VERSION="${CI_COMMIT_TAG#v}"
    - export COMMIT_ID="${CI_COMMIT_SHA:0:7}"
    - export BUILD_EPOCH="$(date -u +%s)"
    - export BUILD_DATE="$(date -u -d @$BUILD_EPOCH +"%Y-%m-%dT%H:%M:%SZ")"
    # OFFICIAL_SITE (optional): site.txt wins; otherwise use CI/CD Variables or leave empty
    # Never guess or assume - must be explicitly defined by user
    - |
      if [ -f site.txt ]; then
        export OFFICIAL_SITE="$(cat site.txt)"
      else
        export OFFICIAL_SITE="${OFFICIAL_SITE:-}"
      fi
    - export LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.CommitID=${COMMIT_ID}' -X 'main.BuildEpoch=${BUILD_EPOCH}' -X 'main.BuildDate=${BUILD_DATE}' -X 'main.OfficialSite=${OFFICIAL_SITE}'"

# =============================================================================
# STABLE RELEASE BUILDS (tag push) - All 8 platforms
# =============================================================================

build:linux-amd64:
  <<: *go-build
  stage: build
  variables:
    GOOS: linux
    GOARCH: amd64
  script:
    - go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-linux-amd64 ./src
    - if [ -d "src/client" ]; then go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-linux-amd64 ./src/client; fi
    - if [ -d "src/agent" ]; then go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-linux-amd64 ./src/agent; fi
    # SBOM is release-level - generate once on this leg (cyclonedx-gomod is
    # pre-installed in casjaysdev/go:latest)
    - cyclonedx-gomod mod -json -output ${PROJECT_NAME}-sbom.cdx.json
    # Export the release version via dotenv - a job's own dotenv is never
    # visible to its own declarative `release:` block, and that block cannot
    # shell-expand ${CI_COMMIT_TAG#v}, so the value is carried upstream here
    - echo "RELEASE_VERSION=${CI_COMMIT_TAG#v}" > release.env
  artifacts:
    paths:
      - ${PROJECT_NAME}-linux-amd64*
      - ${PROJECT_NAME}-sbom.cdx.json
    reports:
      dotenv: release.env
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/

build:linux-arm64:
  <<: *go-build
  stage: build
  variables:
    GOOS: linux
    GOARCH: arm64
  script:
    - go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-linux-arm64 ./src
    - if [ -d "src/client" ]; then go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-linux-arm64 ./src/client; fi
    - if [ -d "src/agent" ]; then go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-agent-linux-arm64 ./src/agent; fi
  artifacts:
    paths:
      - ${PROJECT_NAME}-linux-arm64*
