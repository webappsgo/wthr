# wthr - Test compose (DEBUG=true enabled)
# nginx proxy address - http://172.17.0.1:64581
# Usage: docker compose -f docker-compose.test.yml up -d

name: wthr

x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  wthr:
    image: ghcr.io/webappsgo/wthr:devel
    container_name: wthr-app
    hostname: wthr
    restart: "no"
    pull_policy: always
    logging: *default-logging
    environment:
      MODE: development
      PORT: 80
      DEBUG: true
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: wthr-app
      CACHE_URL: valkey://wthr-cache:6379
    ports:
      - "172.17.0.1:64581:80"
    volumes:
      # TEMP DIR WORKFLOW: ./volumes/ resolves to $TEMP_DIR/volumes/
      # NEVER run from project directory - always use temp dir workflow
      - ./volumes/config:/config:z
      - ./volumes/data:/data:z
    healthcheck:
      test: /usr/local/bin/wthr --status
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      wthr-cache:
        condition: service_healthy
    networks:
      - wthr

  wthr-cache:
    image: valkey/valkey:alpine
    container_name: wthr-cache
    restart: "no"
    logging: *default-logging
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - wthr

networks:
  wthr:
    name: wthr
    external: false
