# wthr - Development compose (DEBUG commented)
# nginx proxy address - http://172.17.0.1:64580
# Usage: docker compose -f docker-compose.dev.yml up -d

name: wthr-dev

x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  wthr:
    image: ghcr.io/webappsgo/wthr:latest
    container_name: wthr-dev
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      # Development: relaxed security, verbose logging, no caching
      # Does NOT enable debug endpoints - uncomment DEBUG to enable
      MODE: development
      PORT: 80
      TZ: ${TZ:-America/New_York}
      # DEBUG: Uncomment to enable pprof, expvar, detailed request logging
      # DEBUG: true
    ports:
      # Development: accessible from all interfaces
      - "64580:80"
    volumes:
      # TEMP DIR WORKFLOW: ./volumes/ resolves to $TEMP_DIR/volumes/
      # NEVER run from project directory - always use temp dir workflow
      - ./volumes/config:/config
      - ./volumes/data:/data
    healthcheck:
      test: /usr/local/bin/wthr --status
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - wthr-dev

networks:
  wthr-dev:
    name: wthr-dev
    external: false
