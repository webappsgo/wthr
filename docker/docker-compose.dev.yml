# wthr - Development compose (debug enabled)
# nginx proxy address - http://172.17.0.1:64580
# Usage: docker compose -f docker-compose.dev.yml up -d

name: wthr

x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  wthr:
    image: ghcr.io/webappsgo/wthr:devel
    container_name: wthr-app
    hostname: wthr
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      # Development: relaxed security, verbose logging, no caching
      MODE: development
      DEBUG: true
      PORT: 80
      TZ: ${TZ:-America/New_York}
    ports:
      # Development: accessible from all interfaces
      - "64580:80"
    volumes:
      # TEMP DIR WORKFLOW: ./volumes/ resolves to $TEMP_DIR/volumes/
      # NEVER run from project directory - always use temp dir workflow
      - ./volumes/config:/config
      - ./volumes/data:/data
    healthcheck:
      test: /usr/local/bin/wthr --status
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - wthr

networks:
  wthr:
    name: wthr
    external: false
