# wthr - Production compose
# nginx proxy address - http://172.17.0.1:64580
# Usage: docker compose -f docker-compose.yml up -d

name: wthr

x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  wthr:
    image: ghcr.io/webappsgo/wthr:latest
    container_name: wthr-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      # Production: strict security, minimal logging, caching enabled
      # Binary defaults to production; MODE/DEBUG are set only in dev/test compose
      PORT: 80
      TZ: ${TZ:-America/New_York}
    ports:
      # Production: bound to Docker bridge only (reverse proxy handles external)
      - "172.17.0.1:64580:80"
    volumes:
      # TEMP DIR WORKFLOW: ./volumes/ resolves to $TEMP_DIR/volumes/
      # NEVER run from project directory - always use temp dir workflow
      - ./volumes/config:/config:z
      - ./volumes/data:/data:z
    healthcheck:
      test: /usr/local/bin/wthr --status
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - wthr

networks:
  wthr:
    name: wthr
    external: false
